<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Achievements – GeoAtlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27%231b64c4%27 stroke=%27%2322e07a%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head><body>
<main class="wrap">
  <div class="page-title"><h1><span class="grad">Achievements</span></h1><p class="muted" id="sum"></p></div>
  <div class="ach-grid" id="grid"></div>
  <h2 style="margin-top:36px">Best scores</h2>
  <div class="card" id="best"></div>
  <p style="margin-top:26px"><button class="btn ghost small" id="reset">Reset all progress</button></p>
</main>
<footer class="site-footer"></footer>
<script src="js/common.js"></script>
<script>
const s = Geo.load();
Geo.checkAchievements(s);
const got = Object.keys(s.ach).length;
document.getElementById('sum').textContent = `${got} of ${Geo.ACH.length} unlocked`;
document.getElementById('grid').innerHTML = Geo.ACH.map(a => {
  const v = Math.min(a.val(s), a.goal), has = !!s.ach[a.id];
  return `<div class="card ach ${has ? 'got' : ''}"><span class="a-ico">${a.icon}</span><div style="flex:1"><h3>${a.name}${has ? ' ✓' : ''}</h3><p>${a.desc}</p>
    ${has ? '' : `<div class="bar"><i style="width:${100 * v / a.goal}%"></i></div><p>${v} / ${a.goal}</p>`}</div></div>`;
}).join('');
const names = { capital: 'Capitals', flag: 'Flags', find: 'Find on map', identify: 'Identify on map' };
const rows = Object.entries(s.best).map(([k, v]) => { const [m, r] = k.split('|'); return `<tr><td>${names[m] || m}</td><td>${r}</td><td><b>${v}</b></td></tr>`; });
document.getElementById('best').innerHTML = rows.length ? `<table style="width:100%;text-align:left"><tr class="muted"><th>Mode</th><th>Region</th><th>Best score</th></tr>${rows.join('')}</table>` : '<span class="muted">Finish a scored quiz to set a best score.</span>';
document.getElementById('reset').onclick = () => { if (confirm('Erase all saved progress?')) { localStorage.removeItem('geoatlas.v1'); location.reload(); } };
</script>
</body></html>
