<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore – GeoAtlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27%231b64c4%27 stroke=%27%2322e07a%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div class="explore">
  <div class="stage" id="stage">
    <canvas id="globe"></canvas>
    <div class="tools">
      <input type="search" id="search" placeholder="Search a country…" autocomplete="off">
      <ul class="results" id="results" hidden></ul>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
  </div>
  <aside class="side" id="side" hidden></aside>
</div>
<script src="vendor/d3.min.js"></script><script src="vendor/topojson-client.min.js"></script>
<script src="data/world.js"></script><script src="data/countries.js"></script><script src="data/stories.js"></script>
<script src="js/common.js"></script><script src="js/globe.js"></script>
<script>
const $ = id => document.getElementById(id);
const byCode = {}; COUNTRIES.forEach(c => byCode[c.code] = c);
const globe = GeoGlobe($('globe'), { spin: true, tip: $('tip'), onSelect: show });
$('zin').onclick = () => globe.zoomBy(1.4); $('zout').onclick = () => globe.zoomBy(1 / 1.4);
let current = null;
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

function show(c, focus) {
  current = c; globe.setSpin(false); globe.select(c, focus);
  Geo.update(s => {
    if (s.visited.includes(c.code)) return;
    s.visited.push(c.code);
    s.regionVisits[c.region] = (s.regionVisits[c.region] || 0) + 1;
    if (c.landlocked) s.landlockedVisits++;
    if (c.area < 1000) s.tinyVisits++;
  });
  render();
}
function render() {
  const c = current, side = $('side');
  const nb = c.borders.map(b => byCode[b]).filter(Boolean);
  side.hidden = false;
  side.innerHTML = `<button class="close" id="close" aria-label="Close">×</button>${Geo.flagHTML(c, 48)}<h2>${esc(c.name)}</h2><div class="official">${esc(c.official)}${c.independent ? '' : ' · territory / dependency'}</div>
    <a class="btn" style="margin:4px 0 16px" href="country.html?c=${c.code}">Learn more about ${esc(c.name)} →</a>
    <dl class="kv">
      <dt>Capital</dt><dd>${esc(c.capital || '—')}</dd>
      <dt>Region</dt><dd>${esc(c.subregion || c.region)}</dd>
      <dt>Population</dt><dd>${Geo.fmt(c.population)}</dd>
      <dt>Area</dt><dd>${Geo.fmt(c.area)} km²</dd>
      <dt>Currency</dt><dd>${esc(c.currencies.join(', ') || '—')}</dd>
      <dt>Neighbors</dt><dd>${nb.length ? nb.map(n => `<button class="chip" data-c="${n.code}">${esc(n.name)}</button>`).join('') : (c.landlocked ? '—' : 'None by land')}</dd></dl>`;
  side.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { Geo.update(s => { s.hops++; }); show(byCode[b.dataset.c]); });
  side.scrollTop = 0;
  $('close').onclick = () => { current = null; side.hidden = true; globe.select(null, false); globe.setSpin(true); };
}

// search
const sorted = COUNTRIES.slice().sort((a, b) => a.name.localeCompare(b.name));
$('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(), ul = $('results');
  if (!q) { ul.hidden = true; return; }
  const m = sorted.filter(c => c.name.toLowerCase().includes(q) || c.capital.toLowerCase().includes(q)).slice(0, 8);
  ul.innerHTML = m.map(c => `<li data-c="${c.code}">${Geo.flagHTML(c, 18)} ${esc(c.name)}</li>`).join('') || '<li class="muted">No match</li>';
  ul.hidden = false;
  ul.querySelectorAll('li[data-c]').forEach(li => li.onclick = () => { show(byCode[li.dataset.c]); ul.hidden = true; $('search').value = ''; });
});
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') { const li = document.querySelector('#results li[data-c]'); if (li) li.click(); } });
const want = new URLSearchParams(location.search).get('c');
if (want && byCode[want]) show(byCode[want]);
</script>
</body></html>
