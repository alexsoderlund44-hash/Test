<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Languages – GeoAtlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2713%27 fill=%27%231b64c4%27 stroke=%27%2322e07a%27 stroke-width=%273%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head><body>
<main class="wrap">
  <div class="page-title"><h1><span class="grad">Learn</span> a language</h1><p class="muted">Pick a language, work through the lessons, then pass each quiz to earn a ✓.</p></div>
  <div class="bigopts" id="langs"></div>
</main>
<footer class="site-footer"></footer>
<script src="data/lang.js"></script><script src="js/common.js"></script>
<script>
const s = Geo.load();
document.getElementById('langs').innerHTML = Object.entries(LANGS).map(([k, l]) => {
  const done = Object.values((s.lang || {})[k] || {}).filter(x => x.done).length, n = LANG_SECTIONS.length;
  return `<a class="bigopt" href="learn.html?lang=${k}" style="text-decoration:none"><span class="bi">${l.flag}</span><b>${l.name}</b>
    <span class="grad" style="font-size:1.3rem;font-weight:700" ${l.rtl ? 'dir="rtl"' : ''}>${l.native}</span>
    <small>${l.level}</small><small>${done} / ${n} lessons passed</small>
    <span class="progress" style="width:100%;margin-top:8px"><i style="width:${100 * done / n}%"></i></span></a>`;
}).join('');
</script>
</body></html>
